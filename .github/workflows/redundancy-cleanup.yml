name: Redundancy cleanup

on:
  push:
    branches: [soft-brutalist-editorial]
    paths:
      - .github/workflows/redundancy-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tighten repeated copy
        run: |
          python - <<'PY'
          from pathlib import Path

          layout = Path('src/layouts/BaseLayout.astro')
          text = layout.read_text()

          old_current = '''        const currentCard = hero.querySelector('.kh-current-card');
        if (currentCard instanceof HTMLElement) {
          const currentCopy = currentCard.querySelector(':scope > p');
          if (currentCopy instanceof HTMLParagraphElement) {
            currentCopy.textContent =
              'Turning unwritten rules, complicated decisions, and repeatable friction into clearer systems people can actually use.';
          }

          const currentMeta = currentCard.querySelectorAll('.kh-current-meta dd');
          if (currentMeta[0])
            currentMeta[0].textContent = 'Media investment / leadership / systems';
          if (currentMeta[1])
            currentMeta[1].textContent = 'Making the implicit explicit / personal experiments';
        }'''
          new_current = '''        const currentCard = hero.querySelector('.kh-current-card');
        if (currentCard instanceof HTMLElement) {
          const currentCopy = currentCard.querySelector(':scope > p');
          if (currentCopy instanceof HTMLParagraphElement) currentCopy.remove();

          const currentLabels = currentCard.querySelectorAll('.kh-current-meta dt');
          const currentMeta = currentCard.querySelectorAll('.kh-current-meta dd');
          if (currentLabels[1]) currentLabels[1].textContent = 'Exploring';
          if (currentMeta[0])
            currentMeta[0].textContent = 'Media investment / leadership / systems';
          if (currentMeta[1])
            currentMeta[1].textContent = 'AI workflows / personal experiments / culture';
        }'''
          if old_current not in text:
              raise SystemExit('Homepage current card block not found')
          text = text.replace(old_current, new_current)

          old_about = '''        const aboutBody = aboutSection.querySelector('.kh-about-body');
        if (aboutBody instanceof HTMLElement && aboutBody.dataset.threadEnhanced !== 'true') {
          aboutBody.querySelectorAll(':scope > p').forEach((paragraph) => paragraph.remove());

          const aboutCopy = document.createElement('p');
          aboutCopy.className = 'kh-about-lead';
          aboutCopy.textContent =
            'A lot of how I work comes from needing to understand the rules beneath a system. What does it expect? Where does it break? What has everyone else simply learned to work around? That instinct shows up in my media work, my approach to AI and workflows, and the little experiments I build for myself.';

          const notes = aboutBody.querySelector('.kh-about-notes');
          aboutBody.insertBefore(aboutCopy, notes ?? null);

          const sourceLink = professionalSection.querySelector('.kh-system-footer a');
          if (sourceLink instanceof HTMLAnchorElement) {
            const aboutLink = sourceLink.cloneNode(true);
            if (aboutLink instanceof HTMLAnchorElement) {
              aboutLink.classList.add('kh-home-about-link');
              aboutBody.insertBefore(aboutLink, notes ?? null);
            }
          }

          aboutBody.dataset.threadEnhanced = 'true';
        }'''
          new_about = '''        const aboutBody = aboutSection.querySelector('.kh-about-body');
        if (aboutBody instanceof HTMLElement && aboutBody.dataset.threadEnhanced !== 'true') {
          aboutBody.replaceChildren();

          const sourceLink = professionalSection.querySelector('.kh-system-footer a');
          if (sourceLink instanceof HTMLAnchorElement) {
            const aboutLink = sourceLink.cloneNode(true);
            if (aboutLink instanceof HTMLAnchorElement) {
              aboutLink.classList.add('kh-home-about-link');
              aboutBody.appendChild(aboutLink);
            }
          }

          aboutBody.dataset.threadEnhanced = 'true';
        }'''
          if old_about not in text:
              raise SystemExit('Homepage About block not found')
          layout.write_text(text.replace(old_about, new_about))

          about = Path('src/pages/about/index.astro')
          text = about.read_text()

          old_projects = '''      <p>
        Outside my day job, that same curiosity tends to turn into small experiments:
        <strong>Duel Cut</strong> for ranking movies through head to head choices,
        <strong>Encore</strong> for figuring out which concerts really were the best,
        <strong>Duel Draw</strong> for playing a drawing game directly with one other person, and
        <strong>Points</strong> for exploring a more focused, ritual driven guided practice.
      </p>'''
          new_projects = '''      <p>
        Outside my day job, that same curiosity tends to turn into small experiments in movies,
        music, games, and whatever question I cannot stop trying to answer.
      </p>'''
          if old_projects not in text:
              raise SystemExit('About project paragraph not found')
          text = text.replace(old_projects, new_projects)

          start = text.find('  <section class="kh-about-ledger section"')
          end = text.find('  <section class="kh-about-method section"', start)
          if start == -1 or end == -1:
              raise SystemExit('About Currently section not found')
          text = text[:start] + text[end:]

          text = text.replace('<p class="kh-kicker">03 / HOW I WORK</p>', '<p class="kh-kicker">02 / HOW I WORK</p>')
          text = text.replace('<p class="kh-kicker">04 / ACCESSIBILITY</p>', '<p class="kh-kicker">03 / ACCESSIBILITY</p>')
          text = text.replace('<p class="kh-kicker">05 / OFF THE CLOCK</p>', '<p class="kh-kicker">04 / OFF THE CLOCK</p>')
          about.write_text(text)
          PY

          npx prettier --write src/layouts/BaseLayout.astro src/pages/about/index.astro

      - name: Verify build
        env:
          SITE_URL: https://iphiginea.github.io
          BASE_PATH: /kiahharpool/preview/soft-brutalist-editorial
        run: npm run build

      - name: Commit cleanup
        run: |
          git config user.name "iphiginea"
          git config user.email "kiah.harpool@gmail.com"
          git add -- src/layouts/BaseLayout.astro src/pages/about/index.astro
          git commit -m "Tighten repeated site copy"
          git push origin HEAD:soft-brutalist-editorial
