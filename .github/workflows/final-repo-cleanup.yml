# Triggered after workflow file was established on the preview branch.
name: Final repository cleanup

on:
  push:
    branches: [soft-brutalist-editorial]
    paths:
      - .github/workflows/final-repo-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final source cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/index.astro')
          text = p.read_text()
          text = text.replace(
              '''        <p class="kh-hero-positioning">\n          Media leader working across strategy, investment, AI, and the systems behind better\n          decisions.\n        </p>''',
              '''        <p class="kh-hero-positioning">\n          I work across media, strategy, and technology, making hidden logic visible and complicated\n          systems easier to navigate.\n        </p>''')
          text = text.replace('href="#selected-work">See my work →</a>', 'href="#what-i-do">See my work →</a>')
          text = text.replace(
              '''        <p>\n          Executing media investment, developing teams, and exploring how to make complicated work\n          clearer.\n        </p>\n''', '')
          text = text.replace('<dt>Curious about</dt>\n            <dd>Bettering workflows / personal experiments</dd>', '<dt>Exploring</dt>\n            <dd>AI workflows / personal experiments / culture</dd>')
          text = text.replace('<dd>Media strategy / investment / leadership</dd>', '<dd>Media investment / leadership / systems</dd>')

          text = re.sub(r'\n\s*<div class="kh-product-visual kh-product-visual-duelcut">.*?</div>\n\s*</article>', '\n    </article>', text, count=1, flags=re.S)
          text = re.sub(r'\n\s*<div class="kh-product-visual kh-product-visual-encore">.*?</div>\n\s*</article>', '\n    </article>', text, count=1, flags=re.S)

          work_start = text.index('  <section class="kh-work section" aria-labelledby="selected-work">')
          system_start = text.index('  <section class="kh-system section" aria-labelledby="what-i-do">')
          recognition_start = text.index('  <section class="kh-recognition section" aria-labelledby="recognition">')
          work = text[work_start:system_start]
          system = text[system_start:recognition_start]
          text = text[:work_start] + system + work + text[recognition_start:]
          text = text.replace('<p class="kh-kicker">02 / WHAT I DO</p>', '<p class="kh-kicker">01 / WHAT I DO</p>', 1)
          text = text.replace('<p class="kh-kicker">01 / PERSONAL EXPERIMENTS</p>', '<p class="kh-kicker">02 / PERSONAL EXPERIMENTS</p>', 1)

          text = text.replace(
              '''          <p>\n            Finding repeatable friction, mapping the decision logic underneath it, and building\n            tools that remove unnecessary work.\n          </p>''',
              '''          <p>\n            I tend to notice the parts of a system everyone else has learned to work around. I make\n            the rules visible, map the decision logic, and build something easier to use.\n          </p>''')

          marker = '''    <div class="kh-system-footer">\n      <a class="kh-text-link" href={withBase('/about/')}>More about how I work →</a>\n    </div>'''
          text = text.replace(marker, '''    <aside class="kh-home-thread" aria-label="A note on clear systems">\n      <p>Clear systems should not require intuition.</p>\n    </aside>\n\n''' + marker, 1)

          text = text.replace('''        <h2 id="about">I like the point where strategy turns into something useful.</h2>''', '''        <h2 id="about">I like making a neurotypical world more legible to a neurodivergent brain.</h2>''')
          about_start = text.index('      <div class="kh-about-body">')
          about_end = text.index('\n      </div>\n    </div>\n  </section>', about_start)
          text = text[:about_start] + '''      <div class="kh-about-body">\n        <a class="kh-text-link kh-home-about-link" href={withBase('/about/')}>More about how I work →</a>''' + text[about_end:]

          contact_start = text.find('  <section class="kh-contact section">')
          if contact_start != -1:
              contact_end = text.index('  </section>', contact_start) + len('  </section>')
              text = text[:contact_start] + text[contact_end:]

          text = text.replace('<h3>Executive NEXT Buyer Honoree</h3>', '<h3><a href="https://www.tvb.org/events/executive-summit/" target="_blank" rel="noopener noreferrer">TVB NEXT Media Buyer Honoree</a></h3>')
          text = text.replace('<p>Recognition for my work in media investment and buying.</p>', '<p>Recognized as the next generation of leadership in advertising sales, buying, planning, and operations in the media industry.</p>')
          text = text.replace('<strong>MEDIA ADVERTISING CLUB OF CHICAGO</strong>', '<strong><a href="https://www.macchicago.com" target="_blank" rel="noopener noreferrer">MEDIA ADVERTISING CLUB OF CHICAGO</a></strong>')

          for old, new in {
              'head-to-head': 'head to head',
              'ticket-like': 'ticket like',
              'two-player': 'two player',
              'REAL-TIME': 'REAL TIME',
              'body-point-based': 'body point based',
              'self-hypnosis': 'self hypnosis',
              'at-home': 'at home',
              'LOCATION-AWARE': 'LOCATION AWARE',
              'location-aware': 'location aware',
              'community-building': 'community building',
              '2025–26': '2025 / 2026',
              ' — ': ', ',
          }.items():
              text = text.replace(old, new)

          home_css = '''\n  .kh-home-thread {\n    margin-top: clamp(2.5rem, 6vw, 5.5rem);\n    padding: clamp(2rem, 4vw, 3.5rem) 0;\n    border-top: 1px solid rgba(90, 31, 79, 0.25);\n    border-bottom: 1px solid rgba(90, 31, 79, 0.25);\n    color: #5a1f4f;\n  }\n\n  .kh-home-thread p {\n    max-width: 18ch;\n    margin: 0;\n    font-family: var(--font-display);\n    font-size: clamp(2.6rem, 6vw, 6.5rem);\n    font-style: italic;\n    font-weight: 900;\n    letter-spacing: -0.055em;\n    line-height: 0.9;\n  }\n\n  .kh-home-about-link {\n    display: inline-block;\n    margin-top: 0.6rem;\n  }\n'''
          text = text.replace('<style>\n', '<style>' + home_css, 1)
          p.write_text(text)

          p = Path('src/layouts/BaseLayout.astro')
          text = p.read_text()
          text = re.sub(r'\n\s*<style is:global>.*?</style>\n', '\n', text, count=1, flags=re.S)
          fallback_script = '''    <script>\n      const screenshotFallbacks = new Map([\n        ['duelcut-duel-hd.webp', 'duelcut-duel.webp'],\n        ['encore-duel-hd.webp', 'encore-duel.webp'],\n        ['encore-rankings-hd.webp', 'encore-rankings.webp'],\n      ]);\n\n      document.addEventListener(\n        'error',\n        (event) => {\n          const image = event.target;\n          if (!(image instanceof HTMLImageElement) || image.dataset.fallbackApplied === 'true') return;\n          const failedName = image.currentSrc.split('/').pop();\n          if (!failedName) return;\n          const fallbackName = screenshotFallbacks.get(failedName);\n          if (!fallbackName) return;\n          image.dataset.fallbackApplied = 'true';\n          image.src = image.src.replace(failedName, fallbackName);\n        },\n        true,\n      );\n    </script>'''
          text = re.sub(r'    <script>.*?</script>', fallback_script, text, count=1, flags=re.S)
          p.write_text(text)

          p = Path('src/pages/works/index.astro')
          text = p.read_text().replace(
              '''    <p>\n      Personal projects that started with a small irritation, an impossible question, or the\n      recurring thought: why isn’t there a better way to do this?\n    </p>''',
              '''    <p>\n      Small experiments that usually start with friction, curiosity, or a question I cannot stop\n      trying to answer. I build them to make something fuzzy, subjective, or complicated a little\n      more legible.\n    </p>''')
          p.write_text(text)

          p = Path('src/pages/about/index.astro')
          p.write_text(p.read_text().replace('Publicis Media Groupe', 'Publicis Media'))

          Path('src/content.config.ts').write_text("""import { defineCollection } from 'astro:content';\nimport { glob } from 'astro/loaders';\nimport { z } from 'astro/zod';\n\nconst works = defineCollection({\n  loader: glob({ pattern: '**/[^_]*.{md,mdx}', base: './src/content/works' }),\n  schema: ({ image }) =>\n    z.object({\n      title: z.string(),\n      description: z.string(),\n      tech: z.array(z.string()),\n      link: z.string().url().optional(),\n      repo: z.string().url().optional(),\n      thumbnail: image().optional(),\n      order: z.number().optional(),\n      publishDate: z.coerce.date(),\n    }),\n});\n\nexport const collections = { works };\n""")

          p = Path('astro.config.mjs')
          text = p.read_text()
          text = text.replace("import { unified } from '@astrojs/markdown-remark';\n", '')
          text = text.replace("import { remarkReadingTime } from './remark-reading-time.mjs';\n", '')
          text = re.sub(r"\n  markdown: \{\n    processor: unified\(\{\n      remarkPlugins: \[remarkReadingTime\],\n    \}\),", "\n  markdown: {", text)
          p.write_text(text)

          Path('README.md').write_text("""# Kiah Harpool\n\nPersonal portfolio for Kiah Harpool, a Chicago media leader working across media investment, strategy, systems, AI workflows, and culture.\n\n## Site\n\nThe portfolio is built as an editorial home base for professional work, recognition, leadership, and personal experiments. The visual direction uses oversized typography, soft brutalist structure, and a plum, lavender, and blush palette.\n\n## Experiments\n\nThe Work section includes Duel Cut, Encore, Duel Draw, Points, and First Light. Each project has its own case study or project page, with links to the live experiment and source repository where available.\n\n## Stack\n\nAstro 7, TypeScript, MDX, self hosted Fontsource typography, Satori and Sharp for Open Graph images, and GitHub Pages for hosting.\n\n## Development\n\n```sh\nnpm install\nnpm run dev\n```\n\nRun the full validation locally with:\n\n```sh\nnpm run format:check\nnpm run check\nnpm run build\n```\n\n## Deployment\n\nProduction is built from `main`. The redesign preview is built from `soft-brutalist-editorial` and published under `/preview/soft-brutalist-editorial/` until the draft redesign pull request is approved and merged.\n""")
          PY

          rm -f remark-reading-time.mjs
          npm uninstall @astrojs/rss @astrojs/markdown-remark mdast-util-to-string reading-time pagefind
          npm pkg set name=kiah-harpool-portfolio
          npm pkg delete scripts.postbuild

          npx prettier --write \
            src/pages/index.astro \
            src/layouts/BaseLayout.astro \
            src/pages/works/index.astro \
            src/pages/about/index.astro \
            src/content.config.ts \
            astro.config.mjs \
            package.json \
            README.md

      - name: Audit dependencies
        run: npm audit --json > audit.json || true

      - name: Summarize audit
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          console.log('AUDIT_SUMMARY=' + JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(`AUDIT_ITEM ${name}: severity=${item.severity} direct=${item.isDirect} fix=${JSON.stringify(item.fixAvailable)}`);
          }
          NODE
          rm -f audit.json

      - name: Validate site
        env:
          SITE_URL: https://iphiginea.github.io
          BASE_PATH: /kiahharpool/preview/soft-brutalist-editorial
        run: |
          npm run format:check
          npm run check
          npm run build

      - name: Commit cleanup
        run: |
          git config user.name "iphiginea"
          git config user.email "kiah.harpool@gmail.com"
          git add -- \
            README.md \
            astro.config.mjs \
            package.json \
            package-lock.json \
            src/content.config.ts \
            src/layouts/BaseLayout.astro \
            src/pages/index.astro \
            src/pages/about/index.astro \
            src/pages/works/index.astro \
            remark-reading-time.mjs
          git commit -m "Finish portfolio repository cleanup"
          git push origin HEAD:soft-brutalist-editorial
