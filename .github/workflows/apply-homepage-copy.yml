name: Apply homepage copy

on:
  push:
    branches: [soft-brutalist-editorial]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout editorial branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial
      - name: Apply homepage hierarchy and copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/index.astro')
          text = path.read_text()

          # Current-focus card copy.
          text = text.replace(
              '''        <p>\n          Leading media strategy, developing teams, and exploring how AI can make complicated work\n          clearer.\n        </p>''',
              '''        <p>\n          Executing media investment, developing teams, and exploring how to make complicated work\n          clearer.\n        </p>''',
          )
          text = text.replace(
              '<dd>AI workflows / personal experiments</dd>',
              '<dd>Bettering workflows / personal experiments</dd>',
          )

          # Make the professional section truly precede experiments in source order.
          work_marker = '  <section class="kh-work section"'
          system_marker = '  <section class="kh-system section"'
          recognition_marker = '  <section class="kh-recognition section"'
          work_start = text.index(work_marker)
          system_start = text.index(system_marker)
          recognition_start = text.index(recognition_marker)
          if work_start < system_start:
              work_block = text[work_start:system_start]
              system_block = text[system_start:recognition_start]
              text = text[:work_start] + system_block + '\n' + work_block + text[recognition_start:]

          # Correct section numbering and hero anchor after source reorder.
          text = text.replace('<p class="kh-kicker">02 / WHAT I DO</p>', '<p class="kh-kicker">01 / WHAT I DO</p>')
          text = text.replace('<p class="kh-kicker">01 / PERSONAL EXPERIMENTS</p>', '<p class="kh-kicker">02 / PERSONAL EXPERIMENTS</p>')
          text = text.replace('href="#selected-work">See my work →', 'href="#what-i-do">See my work →')

          # Professional section copy.
          text = text.replace(
              '''            Turning audience, market, and investment complexity into clear decisions — then leading\n            teams through execution.''',
              '''            Turning audience, market, and investment complexity into clear decisions, then leading\n            teams through execution.''',
          )
          text = text.replace(
              '''            Finding repeatable friction, mapping the decision logic underneath it, and building\n            AI-assisted tools that remove unnecessary work.''',
              '''            Finding repeatable friction, mapping the decision logic underneath it, and building tools\n            that remove unnecessary work.''',
          )

          # Replace Recognition + Leadership with MAC leadership only.
          recognition_start = text.index('  <section class="kh-recognition section"')
          about_start = text.index('  <section class="kh-about section"')
          recognition = '''  <section class="kh-recognition section" aria-labelledby="recognition">\n    <div class="kh-section-head kh-section-head-ui">\n      <div>\n        <p class="kh-kicker">03 / RECOGNITION + LEADERSHIP</p>\n        <h2 id="recognition">A few things worth noting.</h2>\n      </div>\n    </div>\n\n    <div class="kh-recognition-editorial">\n      <article class="kh-recognition-row kh-recognition-row-leadership">\n        <div class="kh-recognition-meta">\n          <span>LEADERSHIP</span>\n          <strong>MEDIA ADVERTISING CLUB OF CHICAGO</strong>\n          <span>2025–26</span>\n        </div>\n        <div class="kh-recognition-copy">\n          <h3>President</h3>\n          <p>\n            Leading industry programming, member engagement, and community-building in Chicago\n            media through Chicago's legacy advertising club.\n          </p>\n        </div>\n      </article>\n    </div>\n  </section>\n\n'''
          text = text[:recognition_start] + recognition + text[about_start:]

          # Replace homepage About with user-approved copy.
          about_start = text.index('  <section class="kh-about section"')
          lab_start = text.index('  <section class="kh-lab section"')
          about = '''  <section class="kh-about section" aria-labelledby="about">\n    <div class="kh-about-shell">\n      <div class="kh-about-heading">\n        <p class="kh-kicker">04 / ABOUT</p>\n        <h2 id="about">I like the point where strategy turns into something useful.</h2>\n      </div>\n\n      <div class="kh-about-body">\n        <p class="kh-about-lead">\n          I’m a Chicago-based media leader working across investment, strategy, operations, AI, and\n          the systems that help people make better decisions.\n        </p>\n        <p>\n          My work usually starts with friction: a process that is harder than it needs to be, a\n          decision that could be clearer, or a system that people have learned to work around. I\n          like finding the structure underneath the problem and making the next step easier to\n          understand.\n        </p>\n        <p>\n          Outside of my work, I’m usually following some curiosity about music, media, or culture,\n          and every so often that curiosity turns into a small experiment of its own.\n        </p>\n      </div>\n    </div>\n  </section>\n\n'''
          text = text[:about_start] + about + text[lab_start:]

          path.write_text(text)

          # Remove the temporary runtime reordering now that source order is correct.
          layout = Path('src/layouts/BaseLayout.astro')
          layout_text = layout.read_text()
          start = layout_text.find('      const arrangeHomepage = () => {')
          end_marker = '      arrangeHomepage();\n\n'
          if start != -1:
              end = layout_text.find(end_marker, start)
              if end != -1:
                  end += len(end_marker)
                  layout_text = layout_text[:start] + layout_text[end:]
          layout.write_text(layout_text)
          PY
      - name: Format edited files
        run: npx prettier --write src/pages/index.astro src/layouts/BaseLayout.astro
      - name: Commit homepage updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro src/layouts/BaseLayout.astro
          git commit -m "Apply approved homepage professional copy"
          git push origin HEAD:soft-brutalist-editorial
