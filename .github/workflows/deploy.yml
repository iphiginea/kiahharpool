name: Deploy to GitHub Pages

# Rebuild both production and the editorial preview when either source changes.
# Production is always checked out from main; the preview is always checked out
# from soft-brutalist-editorial and published under its preview path.
on:
  push:
    branches: [main, soft-brutalist-editorial]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v7
        with:
          ref: main
          path: production-src

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: production-src/.nvmrc
          cache: npm
          cache-dependency-path: production-src/package-lock.json

      - name: Build production site
        working-directory: production-src
        env:
          SITE_URL: https://iphiginea.github.io
          BASE_PATH: /kiahharpool
        run: |
          npm ci
          npm run build

      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial
          path: preview-src

      - name: Format preview layout
        working-directory: preview-src
        run: |
          npm ci
          npx prettier --write src/layouts/BaseLayout.astro
          git config user.name "iphiginea"
          git config user.email "kiah.harpool@gmail.com"
          git add -- src/layouts/BaseLayout.astro
          if ! git diff --cached --quiet; then
            git commit -m "Format project journey enhancer"
            git push origin HEAD:soft-brutalist-editorial
          fi

      - name: Build preview site
        working-directory: preview-src
        env:
          SITE_URL: https://iphiginea.github.io
          BASE_PATH: /kiahharpool/preview/soft-brutalist-editorial
        run: |
          npm run build

      - name: Combine production and preview
        run: |
          mkdir -p site/preview/soft-brutalist-editorial
          cp -a production-src/dist/. site/
          cp -a preview-src/dist/. site/preview/soft-brutalist-editorial/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
