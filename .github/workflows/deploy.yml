name: Deploy to GitHub Pages

# Pages is deployed only from main. The build still checks out the editorial
# branch and publishes it under /preview/soft-brutalist-editorial/.
# Each main run rebuilds the current preview branch head.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v7
        with:
          ref: main
          path: production-src

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: production-src/.nvmrc
          cache: npm
          cache-dependency-path: production-src/package-lock.json

      - name: Build production site
        working-directory: production-src
        env:
          SITE_URL: https://iphiginea.github.io
          BASE_PATH: /kiahharpool
        run: |
          npm ci
          npm run build

      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial
          path: preview-src

      - name: Build preview site
        id: preview_build
        continue-on-error: true
        working-directory: preview-src
        env:
          SITE_URL: https://iphiginea.github.io
          BASE_PATH: /kiahharpool/preview/soft-brutalist-editorial
        run: |
          set -o pipefail
          (npm ci && npm run build) 2>&1 | tee ../preview-build.log

      - name: Report preview build failure
        if: steps.preview_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Preview build failed'
            echo
            echo '```text'
            tail -n 120 preview-build.log
            echo '```'
          } > preview-failure.md
          gh issue comment 1 --repo "${{ github.repository }}" --body-file preview-failure.md
          exit 1

      - name: Combine production and preview
        run: |
          mkdir -p site/preview/soft-brutalist-editorial
          cp -a production-src/dist/. site/
          cp -a preview-src/dist/. site/preview/soft-brutalist-editorial/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
