name: Deploy to GitHub Pages

# Pages is deployed only from main. The build still checks out the editorial
# branch and publishes it under /preview/soft-brutalist-editorial/.
# Each main run rebuilds the current preview branch head.
# Rebuild after the preview static-path fix.
# Rebuild with the cleaned Duel Draw treatment.
# Rebuild with the Points app treatment.
# Rebuild with aligned app-card typography and backgrounds.
# Rebuild after forcing final card styles over page-scoped CSS.
# Rebuild with the Encore app treatment.
# Rebuild with the Duel Cut app treatment.
# Rebuild with Duel Draw sans title and retina project screenshots.
# Rebuild with media-leadership positioning and curiosity framing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v7
        with:
          ref: main
          path: production-src

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: production-src/.nvmrc
          cache: npm
          cache-dependency-path: production-src/package-lock.json

      - name: Build production site
        working-directory: production-src
        env:
          SITE_URL: https://iphiginea.github.io
          BASE_PATH: /kiahharpool
        run: |
          npm ci
          npm run build

      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial
          path: preview-src

      - name: Build preview site
        working-directory: preview-src
        env:
          SITE_URL: https://iphiginea.github.io
          BASE_PATH: /kiahharpool/preview/soft-brutalist-editorial
        run: |
          npm ci
          npm run build

      - name: Combine production and preview
        run: |
          mkdir -p site/preview/soft-brutalist-editorial
          cp -a production-src/dist/. site/
          cp -a preview-src/dist/. site/preview/soft-brutalist-editorial/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
