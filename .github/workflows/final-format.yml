# Formatting pass for the finalized preview source.
name: Final source formatting

on:
  push:
    branches: [soft-brutalist-editorial]
    paths:
      - .github/workflows/final-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format final source
        run: npx prettier --write src/pages/index.astro src/layouts/BaseLayout.astro
      - name: Commit formatting
        run: |
          git config user.name "iphiginea"
          git config user.email "kiah.harpool@gmail.com"
          git add -- src/pages/index.astro src/layouts/BaseLayout.astro
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format final homepage source"
          git push origin HEAD:soft-brutalist-editorial
