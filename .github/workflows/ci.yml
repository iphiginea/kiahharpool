name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Remove unused template dependencies
        run: |
          npm uninstall @astrojs/rss @astrojs/markdown-remark mdast-util-to-string reading-time pagefind
          npm pkg set name=kiah-harpool-portfolio
          npm pkg delete scripts.postbuild
      - name: Apply compatible security fix
        run: npm audit fix
      - name: Verify clean audit
        run: npm audit --audit-level=high
      - name: Validate cleanup
        run: |
          npm run format:check
          npm run check
          npm run build
      - name: Commit package cleanup
        run: |
          git config user.name "iphiginea"
          git config user.email "kiah.harpool@gmail.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove unused template dependencies"
          git push origin HEAD:soft-brutalist-editorial
