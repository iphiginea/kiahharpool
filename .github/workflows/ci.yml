name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-preview-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format card styles
        run: npx prettier --write src/styles/duel-cut.css src/styles/encore.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/duel-cut.css src/styles/encore.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Duel Cut and Encore Work card styles"
          git push origin HEAD:soft-brutalist-editorial
