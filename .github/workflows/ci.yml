name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The deployed site is static. Treat high-severity production dependency
      # findings as blocking, while excluding build-only/dev tooling from this gate.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Formatting is useful feedback, but it should not make an otherwise valid
      # production build look broken in GitHub/email notifications.
      - name: Check formatting
        run: npm run format:check
        continue-on-error: true

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build
