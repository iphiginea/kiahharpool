name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format project journey enhancer
        run: npx prettier --write src/layouts/BaseLayout.astro
      - name: Commit formatting if needed
        run: |
          git config user.name "iphiginea"
          git config user.email "kiah.harpool@gmail.com"
          git add -- src/layouts/BaseLayout.astro
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format project journey enhancer"
          git push origin HEAD:soft-brutalist-editorial
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check formatting
        run: npm run format:check
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
