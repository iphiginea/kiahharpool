name: CI

on:
  pull_request:
  # Keep main verified too, so a green branch that goes stale is caught on merge.
  push:
    branches: [main]

permissions:
  contents: write

# Superseded pushes to the same ref don't need to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-preview-once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout editorial branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format Work page
        run: npx prettier --write src/pages/works/index.astro
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/works/index.astro
          git commit -m "Format Work page mini cards"
          git push origin HEAD:soft-brutalist-editorial

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        # Before the slower steps: a formatting miss is the cheapest failure to
        # surface, and `npm run format` is the whole fix.
        run: npm run format:check
      - name: Type-check
        run: npm run check
      - name: Build
        # Also exercises the postbuild Pagefind index step.
        run: npm run build
