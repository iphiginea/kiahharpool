name: Apply homepage copy once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout editorial branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial

      - name: Apply homepage copy and hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('src/pages/index.astro')
          text = index_path.read_text()

          replacements = {
              """        <p>
          Leading media strategy, developing teams, and exploring how AI can make complicated work
          clearer.
        </p>""": """        <p>
          Executing media investment, developing teams, and exploring how to make complicated work
          clearer.
        </p>""",
              """            <dd>AI workflows / personal experiments</dd>""": """            <dd>Bettering workflows / personal experiments</dd>""",
              """          <p>
            Turning audience, market, and investment complexity into clear decisions — then leading
            teams through execution.
          </p>""": """          <p>
            Turning audience, market, and investment complexity into clear decisions, then leading
            teams through execution.
          </p>""",
              """          <p>
            Finding repeatable friction, mapping the decision logic underneath it, and building
            AI-assisted tools that remove unnecessary work.
          </p>""": """          <p>
            Finding repeatable friction, mapping the decision logic underneath it, and building tools
            that remove unnecessary work.
          </p>""",
              """          <p>
            Leading industry programming, member engagement, and community-building in Chicago
            media.
          </p>""": """          <p>
            Leading industry programming, member engagement, and community-building in Chicago media
            through Chicago's legacy advertising club.
          </p>""",
              """        <p class=\"kh-about-lead\">
          I’m a Chicago-based media leader working across investment, strategy, AI, and the systems
          that help people make better decisions.
        </p>""": """        <p class=\"kh-about-lead\">
          I’m a Chicago-based media leader working across investment, strategy, operations, AI, and
          the systems that help people make better decisions.
        </p>""",
              """        <p>
          Away from the day job, I’m usually following some curiosity about movies, music, media, or
          culture — and every so often that curiosity turns into a small experiment of its own.
        </p>""": """        <p>
          Outside of my work, I’m usually following some curiosity about music, media, or culture,
          and every so often that curiosity turns into a small experiment of its own.
        </p>""",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected homepage block:\n{old}')
              text = text.replace(old, new, 1)

          work_marker = '  <section class="kh-work section"'
          system_marker = '  <section class="kh-system section"'
          recognition_marker = '  <section class="kh-recognition section"'
          work_start = text.index(work_marker)
          system_start = text.index(system_marker)
          recognition_start = text.index(recognition_marker)

          if work_start < system_start:
              work_block = text[work_start:system_start]
              system_block = text[system_start:recognition_start]
              system_block = system_block.replace(
                  '<p class="kh-kicker">02 / WHAT I DO</p>',
                  '<p class="kh-kicker">01 / WHAT I DO</p>',
                  1,
              )
              work_block = work_block.replace(
                  '<p class="kh-kicker">01 / PERSONAL EXPERIMENTS</p>',
                  '<p class="kh-kicker">02 / PERSONAL EXPERIMENTS</p>',
                  1,
              )
              text = text[:work_start] + system_block + '\n' + work_block + text[recognition_start:]

          text = text.replace(
              'class="kh-pill kh-pill-secondary kh-hero-cta" href="#selected-work">See my work →',
              'class="kh-pill kh-pill-secondary kh-hero-cta" href="#what-i-do">See my work →',
              1,
          )
          index_path.write_text(text)

          layout_path = Path('src/layouts/BaseLayout.astro')
          layout = layout_path.read_text()
          start = layout.find('      const arrangeHomepage = () => {')
          end_marker = '      arrangeHomepage();\n\n'
          if start != -1:
              end = layout.find(end_marker, start)
              if end == -1:
                  raise SystemExit('Could not find end of homepage reorder helper')
              end += len(end_marker)
              layout = layout[:start] + layout[end:]
              layout_path.write_text(layout)
          PY

      - name: Format changed files
        run: npx prettier --write src/pages/index.astro src/layouts/BaseLayout.astro

      - name: Commit copy updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro src/layouts/BaseLayout.astro
          git commit -m "Update professional homepage copy"
          git push origin HEAD:soft-brutalist-editorial
