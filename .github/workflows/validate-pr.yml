name: Validate redesign build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        env:
          SITE_URL: https://iphiginea.github.io
          BASE_PATH: /kiahharpool/preview/soft-brutalist-editorial
        run: npm run build
