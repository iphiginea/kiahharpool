name: Validate redesign build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply project journey cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('src/pages/index.astro')
          text = home.read_text()

          pairs = [
          ('''        <div class="kh-project-actions">
          <a
            class="kh-pill"
            href="https://iphiginea.github.io/duelcut/"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open app ↗
          </a>
          <a
            class="kh-text-link"
            href="https://github.com/iphiginea/duelcut"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub ↗
          </a>
        </div>''', '''        <div class="kh-project-actions">
          <a class="kh-pill" href={withBase('/works/duel-cut/')}>See experiment →</a>
          <a
            class="kh-text-link"
            href="https://iphiginea.github.io/duelcut/"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open app ↗
          </a>
        </div>'''),
          ('''        <div class="kh-project-actions">
          <a
            class="kh-pill"
            href="https://iphiginea.github.io/encore/"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open app ↗
          </a>
          <a
            class="kh-text-link"
            href="https://github.com/iphiginea/encore"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub ↗
          </a>
        </div>''', '''        <div class="kh-project-actions">
          <a class="kh-pill" href={withBase('/works/encore/')}>See experiment →</a>
          <a
            class="kh-text-link"
            href="https://iphiginea.github.io/encore/"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open app ↗
          </a>
        </div>'''),
          ('            <h3>DUEL DRAW</h3>', '            <h3><a class="kh-project-title-link" href={withBase(\'/works/duel-draw/\')}>DUEL DRAW</a></h3>'),
          ('''              <a
                class="kh-pill"
                href="https://iphiginea.github.io/dueldraw/duel-draw.html"
                target="_blank"
                rel="noopener noreferrer">Open app ↗</a
              >
              <a
                class="kh-text-link"
                href="https://github.com/iphiginea/dueldraw"
                target="_blank"
                rel="noopener noreferrer">GitHub ↗</a
              >''', '''              <a class="kh-pill" href={withBase('/works/duel-draw/')}>See experiment →</a>
              <a
                class="kh-text-link"
                href="https://iphiginea.github.io/dueldraw/duel-draw.html"
                target="_blank"
                rel="noopener noreferrer">Open app ↗</a
              >'''),
          ('            <h3>POINTS</h3>', '            <h3><a class="kh-project-title-link" href={withBase(\'/works/points/\')}>POINTS</a></h3>'),
          ('''              <a
                class="kh-pill"
                href="https://iphiginea.github.io/points/"
                target="_blank"
                rel="noopener noreferrer">Open app ↗</a
              >
              <a
                class="kh-text-link"
                href="https://github.com/iphiginea/points"
                target="_blank"
                rel="noopener noreferrer">GitHub ↗</a
              >''', '''              <a class="kh-pill" href={withBase('/works/points/')}>See experiment →</a>
              <a
                class="kh-text-link"
                href="https://iphiginea.github.io/points/"
                target="_blank"
                rel="noopener noreferrer">Open app ↗</a
              >'''),
          ('''          <p class="kh-firstlight-visual-label">Listening for what’s nearby…</p>
          <div class="kh-firstlight-bird-list">
            <span><i></i>01 / RECENT + LOCAL</span>
            <span><i></i>02 / RECENT + LOCAL</span>
            <span><i></i>03 / RECENT + LOCAL</span>
            <span><i></i>04 / RECENT + LOCAL</span>
            <span><i></i>05 / RECENT + LOCAL</span>
          </div>''', '''          <p class="kh-firstlight-visual-label">Sample Chicago chorus</p>
          <div class="kh-firstlight-bird-list">
            <span><i></i>01 / EASTERN KINGBIRD</span>
            <span><i></i>02 / PIPING PLOVER</span>
            <span><i></i>03 / EASTERN WOOD PEEWEE</span>
            <span><i></i>04 / DOUBLE CRESTED CORMORANT</span>
            <span><i></i>05 / BLACK AND WHITE WARBLER</span>
          </div>'''),
          ]

          changed = False
          for old, new in pairs:
              if old in text:
                  text = text.replace(old, new)
                  changed = True
          if changed:
              home.write_text(text)

          shared = Path('src/pages/works/[slug].astro')
          text = shared.read_text()
          old = '''          <div class="kh-firstlight-birds" aria-hidden="true">
            <span>
              <i />
              01 / RECENT + LOCAL
            </span>
            <span>
              <i />
              02 / RECENT + LOCAL
            </span>
            <span>
              <i />
              03 / RECENT + LOCAL
            </span>
            <span>
              <i />
              04 / RECENT + LOCAL
            </span>
            <span>
              <i />
              05 / RECENT + LOCAL
            </span>
          </div>'''
          new = '''          <div class="kh-firstlight-birds" aria-hidden="true">
            <p class="kh-firstlight-birds-label">SAMPLE / CHICAGO CHORUS</p>
            <span>
              <i />
              01 / EASTERN KINGBIRD
            </span>
            <span>
              <i />
              02 / PIPING PLOVER
            </span>
            <span>
              <i />
              03 / EASTERN WOOD PEEWEE
            </span>
            <span>
              <i />
              04 / DOUBLE CRESTED CORMORANT
            </span>
            <span>
              <i />
              05 / BLACK AND WHITE WARBLER
            </span>
          </div>'''
          if old in text:
              text = text.replace(old, new)
              css = '''  .kh-firstlight-birds {
    display: grid;
    gap: 0.65rem;
  }
'''
              css_new = '''  .kh-firstlight-birds {
    display: grid;
    gap: 0.65rem;
  }

  .kh-firstlight-birds-label {
    margin: 0 0 0.2rem;
    color: #f2c879;
    font-family: var(--font-mono);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.11em;
  }
'''
              if css not in text:
                  raise SystemExit('First Light CSS anchor not found')
              shared.write_text(text.replace(css, css_new))
          PY
          npx prettier --write src/pages/index.astro 'src/pages/works/[slug].astro'
      - name: Commit source cleanup
        run: |
          git config user.name "iphiginea"
          git config user.email "kiah.harpool@gmail.com"
          git add -- src/pages/index.astro 'src/pages/works/[slug].astro'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Keep project journeys inside portfolio"
          git push origin HEAD:soft-brutalist-editorial
      - name: Build site
        env:
          SITE_URL: https://iphiginea.github.io
          BASE_PATH: /kiahharpool/preview/soft-brutalist-editorial
        run: npm run build
