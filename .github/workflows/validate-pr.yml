name: Validate redesign build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fix About project spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/about/index.astro')
          text = path.read_text()
          old = '''      <p>\n        Outside my day job, that same curiosity tends to turn into small experiments:\n        <strong>Duel Cut</strong> for ranking movies through head to head choices,\n        <strong>Encore</strong> for figuring out which concerts really were the best,\n        <strong>Duel Draw</strong> for playing a drawing game directly with one other person, and\n        <strong>Points</strong> for exploring a more focused, ritual driven guided practice.\n      </p>'''
          new = '''      <p>\n        Outside my day job, that same curiosity tends to turn into small experiments:{' '}\n        <strong>Duel Cut</strong> for ranking movies through head to head choices,{' '}\n        <strong>Encore</strong> for figuring out which concerts really were the best,{' '}\n        <strong>Duel Draw</strong> for playing a drawing game directly with one other person, and{' '}\n        <strong>Points</strong> for exploring a more focused, ritual driven guided practice.\n      </p>'''
          if old not in text:
              raise SystemExit('Expected About paragraph not found')
          path.write_text(text.replace(old, new))
          PY
          npx prettier --write src/pages/about/index.astro
      - name: Build site
        env:
          SITE_URL: https://iphiginea.github.io
          BASE_PATH: /kiahharpool/preview/soft-brutalist-editorial
        run: npm run build
      - name: Restore normal workflow and commit fix
        run: |
          cat > .github/workflows/validate-pr.yml <<'EOF'
          name: Validate redesign build

          on:
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v7
                - name: Set up Node
                  uses: actions/setup-node@v7
                  with:
                    node-version-file: .nvmrc
                    cache: npm
                - name: Install dependencies
                  run: npm ci
                - name: Build site
                  env:
                    SITE_URL: https://iphiginea.github.io
                    BASE_PATH: /kiahharpool/preview/soft-brutalist-editorial
                  run: npm run build
          EOF
          rm -f .github/workflows/fix-about-spacing.yml
          git config user.name "iphiginea"
          git config user.email "kiah.harpool@gmail.com"
          git add -- src/pages/about/index.astro .github/workflows/validate-pr.yml
          git add -u -- .github/workflows/fix-about-spacing.yml
          git commit -m "Fix spacing around About project names"
          git push origin HEAD:soft-brutalist-editorial
