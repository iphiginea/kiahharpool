name: Preview soft brutalist editorial

on:
  push:
    branches: [soft-brutalist-editorial]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/soft-brutalist-editorial/
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial
          path: preview-src

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: preview-src/.nvmrc
          cache: npm
          cache-dependency-path: preview-src/package-lock.json

      - name: Build preview branch
        working-directory: preview-src
        env:
          SITE_URL: https://iphiginea.github.io
          BASE_PATH: /kiahharpool/preview/soft-brutalist-editorial
        run: |
          base64 -d public/images/duelcut-duel-hd.webp.b64 > public/images/duelcut-duel-hd.webp
          base64 -d public/images/encore-duel-hd.webp.b64 > public/images/encore-duel-hd.webp
          base64 -d public/images/encore-rankings-hd.webp.b64 > public/images/encore-rankings-hd.webp
          npm ci
          npm run build

      - name: Checkout production main
        uses: actions/checkout@v7
        with:
          ref: main
          path: production-src

      - name: Build production site
        working-directory: production-src
        env:
          SITE_URL: https://iphiginea.github.io
          BASE_PATH: /kiahharpool
        run: |
          npm ci
          npm run build

      - name: Combine production and preview
        run: |
          mkdir -p site/preview/soft-brutalist-editorial
          cp -a production-src/dist/. site/
          cp -a preview-src/dist/. site/preview/soft-brutalist-editorial/

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
