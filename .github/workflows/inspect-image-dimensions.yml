name: Inspect image dimensions

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare candidate screenshots
        run: |
          mkdir -p /tmp/candidates
          git fetch origin main
          git show origin/main:src/content/works/duel-cut-showcase.webp > /tmp/candidates/duel-cut-showcase.webp || true
          git show origin/main:src/content/works/encore-showcase.webp > /tmp/candidates/encore-showcase.webp || true
          git show origin/main:src/content/works/IMG_4676.jpeg > /tmp/candidates/IMG_4676.jpeg || true
          git show origin/main:IMG_4679.jpeg > /tmp/candidates/IMG_4679.jpeg || true
          cp public/images/duelcut-duel.webp /tmp/candidates/current-duelcut.webp
          cp public/images/encore-duel.webp /tmp/candidates/current-encore-duel.webp
          cp public/images/encore-rankings.webp /tmp/candidates/current-encore-rankings.webp
          file /tmp/candidates/*
      - name: Upload candidates
        uses: actions/upload-artifact@v6
        with:
          name: candidate-screenshots
          path: /tmp/candidates
