name: Format editorial branch

on:
  push:
    branches: [soft-brutalist-editorial]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed Astro files
        run: npx prettier --write src/pages/about/index.astro src/pages/index.astro
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/about/index.astro src/pages/index.astro
          git commit -m "Format positioning copy"
          git push origin HEAD:soft-brutalist-editorial
