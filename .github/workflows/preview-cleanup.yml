name: Preview cleanup formatter

on:
  push:
    branches: [soft-brutalist-editorial]
    paths:
      - .github/workflows/preview-cleanup.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Run preview cleanup formatter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: soft-brutalist-editorial

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove legacy favicon fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/layouts/BaseLayout.astro')
          text = path.read_text()
          text = text.replace("    <link rel=\"icon\" href={withBase('/favicon.ico')} />\n", '')
          path.write_text(text)
          PY

      - name: Format cleanup files
        run: |
          npx prettier --write \
            src/layouts/BaseLayout.astro \
            src/pages/about/index.astro \
            src/styles/encore.css \
            src/pages/og/site.png.ts \
            'src/pages/og/[collection]/[slug].png.ts' \
            src/consts.ts \
            public/favicon.svg

      - name: Commit formatting
        run: |
          git config user.name "iphiginea"
          git config user.email "kiah.harpool@gmail.com"
          git add -- \
            src/layouts/BaseLayout.astro \
            src/pages/about/index.astro \
            src/styles/encore.css \
            src/pages/og/site.png.ts \
            'src/pages/og/[collection]/[slug].png.ts' \
            src/consts.ts \
            public/favicon.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format final preview cleanup"
          git push origin HEAD:soft-brutalist-editorial
